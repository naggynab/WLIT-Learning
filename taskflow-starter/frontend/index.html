
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Bootcamp Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>TaskFlow</h1>
        <p class="subtitle">Full-Stack REST API Workshop</p>
      </div>
      <span id="api-badge" class="badge">Day 1: Public API</span>
    </header>

    <form id="task-form" class="task-form">
      <input type="text" id="task-title" placeholder="Task title..." required />
      <input type="text" id="task-desc" placeholder="Short description..." />
      <button type="submit">Add Task</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div id="task-count" class="task-count">0 tasks</div>
    </div>

    <div id="loading" class="status-box hidden">Loading tasks...</div>
    <div id="error-box" class="status-box error hidden"></div>

    <ul id="task-list" class="task-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
